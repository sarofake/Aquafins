[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  # ---------------------------------------------------------------------------
  # Secret scanning
  # ---------------------------------------------------------------------------
  # These three variables are flagged "Contains secret values" in the Netlify
  # UI, but they hold ordinary identifiers, not credentials:
  #   AQUAFINS_ADMIN_ID  -> "admin"    (only used as the session token subject;
  #                                     the login form only checks the password)
  #   SUPABASE_DB_NAME   -> "postgres" (default database name)
  #   SUPABASE_DB_PORT   -> "5432"     (default Postgres port)
  #
  # Because those values are common strings, the scanner matched them all over
  # vendor bundles (.netlify/**), package-lock.json, skills-lock.json and every
  # "admin" path/identifier in the app. The "secret" flag cannot be removed in
  # the UI once set, so the supported escape hatch is to exclude the keys.
  # Real secrets (SUPABASE_SERVICE_ROLE_KEY, SUPABASE_DB_PASSWORD,
  # AQUAFINS_ADMIN_PASSWORD, AQUAFINS_SESSION_SECRET) remain scanned.
  SECRETS_SCAN_OMIT_KEYS = "AQUAFINS_ADMIN_ID,SUPABASE_DB_NAME,SUPABASE_DB_PORT"

  # Third-party / generated build output. Application source (app/, lib/,
  # components/) is intentionally NOT omitted.
  SECRETS_SCAN_OMIT_PATHS = ".netlify/**,node_modules/**"
